<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="sky" cx="0.3" cy="0.15" r="1.1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="0.55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#05080f"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f4ecd9" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#f4ecd9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffe2b0"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98f35" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#f4b15a"/>
      <stop offset="1" stop-color="#d98f35" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>
  <!-- planet limb -->
  <path d="M-40 520 C 80 360, 432 360, 552 520" fill="none" stroke="url(#horizon)" stroke-width="10" stroke-linecap="round"/>
  <path d="M-40 540 C 80 380, 432 380, 552 540 L552 560 L-40 560 Z" fill="#0f1d36" opacity="0.8"/>
  <!-- stars -->
  <g fill="#eef1f8">
    <circle cx="96" cy="118" r="4" opacity="0.7"/>
    <circle cx="168" cy="72" r="3" opacity="0.5"/>
    <circle cx="420" cy="292" r="3" opacity="0.5"/>
    <circle cx="72" cy="232" r="2.5" opacity="0.45"/>
  </g>
  <!-- the contrail: a long rising arc -->
  <path d="M70 410 C 170 300, 250 210, 382 142" fill="none" stroke="url(#trail)" stroke-width="22" stroke-linecap="round"/>
  <path d="M86 418 C 186 312, 262 226, 384 160" fill="none" stroke="url(#trail)" stroke-width="7" stroke-linecap="round" opacity="0.5"/>
  <!-- the craft: a simple dart, pointing along the arc -->
  <g transform="translate(398 132) rotate(-28)">
    <path d="M44 0 L-22 -26 L-10 0 L-22 26 Z" fill="#ffcd85"/>
    <path d="M44 0 L-10 0 L-22 26 Z" fill="#d98f35"/>
  </g>
  </g>
</svg>
